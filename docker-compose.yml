name: freelanceos-local

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-freelanceos}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # PostgreSQL 18+ declares its volume at this parent directory.
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.8.2
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
